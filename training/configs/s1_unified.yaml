# Task configuration
tasks:
  image_data:
    task_weight: 1.0
    dataset: [
      "ImageCityscapesDataset(resize=(512,640), fill_missing_tasks=False, load_tasks=['rgb'], blur_prob=0.2, blur_motion_kernel=(15,50), blur_kernel=(3,10))",
      "ImageCOCODataset(resize=(512,640), fill_missing_tasks=False, load_tasks=['rgb'], full=False, blur_prob=0.2, blur_motion_kernel=(15,50), blur_kernel=(3,10))",
      "ImageHypersimDataset(resize=(512,640), fill_missing_tasks=False, load_tasks=['rgb'], blur_prob=0.2, blur_motion_kernel=(15,50), blur_kernel=(3,10))",
      "ImageDMSDataset(resize=(512,640), fill_missing_tasks=False, load_tasks=['rgb'], blur_prob=0.2, blur_motion_kernel=(15,50), blur_kernel=(3,10))",
      "ImageVKITTI2Dataset(resize=(512,640), fill_missing_tasks=False, load_tasks=['rgb'], blur_prob=0.2, blur_motion_kernel=(15,50), blur_kernel=(3,10))",
    ]
    dataset_weights: [0.01, 0.53, 0.27, 0.1, 0.09]  # Adjusted weights to balance dataset sizes
  video_data:
    task_weight: 1.0
    dataset: [
      "VideoPointOdysseyDataset(max_frame_skip=8, resize=(512,640), fill_missing_tasks=False, load_tasks=['rgb'], blur_prob=0.2, blur_motion_kernel=(15,50), blur_kernel=(3,10))",
      "VideoSpringDataset(max_frame_skip=8, resize=(512,640), fill_missing_tasks=False, load_tasks=['rgb'], blur_prob=0.2, blur_motion_kernel=(15,50), blur_kernel=(3,10))",
      "VideoTartanairDataset(max_frame_skip=8, resize=(512,640), fill_missing_tasks=False, load_tasks=['rgb'], blur_prob=0.2, blur_motion_kernel=(15,50), blur_kernel=(3,10))",
      "VideoVIPSegDataset(max_frame_skip=4, resize=(512,640), fill_missing_tasks=False, load_tasks=['rgb'], blur_prob=0.2, blur_motion_kernel=(15,50), blur_kernel=(3,10))",
    ]
    dataset_weights: [0.56, 0.01, 0.27, 0.16]

distill_tasks:
  albedo:
    ckpt: "checkpoints/sd2_specialist_A_T4_30k"
  boundary:
    ckpt: "checkpoints/sd2_specialist_B_T4_30k"
  depth:
    ckpt: "checkpoints/sd2_specialist_D_T4_30k"
  illum:
    ckpt: "checkpoints/sd2_specialist_I_T4_30k"
  matseg:
    ckpt: "checkpoints/sd2_specialist_M_T4_80k"
  normal:
    ckpt: "checkpoints/sd2_specialist_N_T4_30k"
  partseg:
    ckpt: "checkpoints/sd2_specialist_P_T4_30k"
  semseg:
    ckpt: "checkpoints/sd2_specialist_S_T4_80k"
  restore:
    ckpt: null  # can use input latent as distill target

connectors:
  lr_multiplier: 3.0
  cls_name: "DPTConnector"
  config:
    output_dim: 4
    fusion_hidden_size: 256
    feature_paths: [
      'mid_block.attentions.0.transformer_blocks.0',      # bottleneck   (8x10, 1280ch)
      'up_blocks.1.attentions.2.transformer_blocks.0',    # 1/4 relative (16x20, 1280ch)
      'up_blocks.2.attentions.2.transformer_blocks.0',    # 1/2 relative (32x40, 640ch)
      'output'                                            # 1/1 relative (64x80, 320ch)     
    ]
    feature_channels: [1280, 1280, 640, 320]

losses:
  albedo:
    multiplier: 1.0
    cls_name: "UnifiedLatentLossFunction"
    params:
      l1: {"weight": 1.0}
      tgm: {"weight": 5.0, "max_diff": 2.0}  # max_diff: 1, 2, null
  boundary:
    copy: albedo
  depth:
    copy: albedo
  illum:
    copy: albedo
  matseg:
    copy: albedo
  normal:
    copy: albedo
  partseg:
    copy: albedo
  semseg:
    copy: albedo
  restore:
    copy: albedo

# Experiment configuration
experiment_name: "" # "", "_1", etc

# Model configuration
architecture: "MemAttnTemp(con)(dec)"
noise_type: "zeros" 
pretrained_model_name: stable-diffusion-2 # see available pretrained models in .pretrained_models.yaml
additional_pseudo_multiplier: 1.0  # weight for pseudo-label losses, set to 0 to disable pseudo-label training

# Training configuration
max_train_steps: 50000
effective_batch_size: 32  # we use gradient accumulation to scale the batch size
batch_size_per_gpu: 2     # this is the "actual" batch size per GPU iter (only supports 1 for track-focal/dice)
temporal_length: 4          # T, number of frames for video data or frame packing temporal dimension for image data
dataloader_num_workers: 8
train_vis_steps: 250

# Resume from checkpoint, you can use latest to resume from the latest checkpoint
resume_from_checkpoint: latest

# Save checkpoints for every 1000 steps, only save the latest checkpoint
checkpointing_steps: 1000
checkpoints_keep_freq: 10000 # keep every 10k checkpoints, in addition to the latest ones, disable by setting to <=0
checkpoints_total_limit: 1

# Don't change these unless you know what you are doing
gradient_checkpointing: true
learning_rate: 3.0e-05
lr_exp_warmup_steps: 1000
lr_total_iter_length: ${max_train_steps}  # Will match max_train_steps
lr_scheduler_type: "linear"  # choices: exponential, linear
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.0e-2
adam_epsilon: 1.0e-08
max_grad_norm: 1.0
seed: 42
mixed_precision: "no"
report_to: "wandb"  # wandb, tensorboard
tracker_project_name: "unid-research"
enable_xformers_memory_efficient_attention: true

# Output directory
output_dir: "checkpoints/sd2_unified_B${effective_batch_size}_T${temporal_length}_${max_train_steps}${experiment_name}"
logging_dir: "logs"

# Evaluation during training
eval:
  steps: 1e10
  tasks: ["depth"]
  instance: "${oc.env:UNID_DATA_ROOT,data}/FastMatteDatasetV2/JPEGImages/10396623-uhd_4096_2160_25fps/"
  out_dir: "vis/log_video"
  length: 50
  stride: 1
  fps: 12
